<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - IBF Motors</title>
    <link rel="icon" href="logo1.png" type="image/png">
    <link rel="shortcut icon" href="logo1.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            margin: 0;
            font-family: 'Open Sans', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f23 100%);
            color: #fff;
            min-height: 100vh;
        }
        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .brand {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
        }
        .nav {
            list-style: none;
            display: flex;
            gap: 16px;
            margin: 0;
            padding: 0;
        }
        .nav a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav a:hover {
            background: linear-gradient(135deg, #dc0000 0%, #ff4444 100%);
            border-color: transparent;
            color: #fff;
        }
        .nav .active {
            border-bottom: none;
            background: linear-gradient(135deg, #dc0000 0%, #ff4444 100%);
            border-color: transparent;
        }
        .cart-badge {
            background: #fff;
            color: #dc0000;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 4px;
        }
        .content {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 40px;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 30px;
            color: #fff;
        }
        h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #fff;
        }
        .empty-cart {
            text-align: center;
            padding: 80px 40px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
        }
        .empty-cart h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            margin-bottom: 12px;
            color: rgba(255,255,255,0.8);
        }
        .empty-cart p {
            color: rgba(255,255,255,0.5);
            margin-bottom: 30px;
            font-size: 16px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #dc0000 0%, #ff4444 100%);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(220, 0, 0, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 0, 0, 0.6);
        }
        .btn-outline {
            background: transparent;
            color: #dc0000;
            border: 2px solid #dc0000;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #dc0000;
            color: #fff;
            box-shadow: 0 4px 20px rgba(220, 0, 0, 0.4);
        }
        .cart-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
        }
        .cart-items {
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
        }
        .cart-item {
            display: flex;
            gap: 24px;
            padding: 24px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .cart-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .cart-item img {
            width: 200px;
            height: 130px;
            object-fit: cover;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .cart-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .cart-item-info h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .cart-item-info p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-bottom: 4px;
        }
        .cart-item-price {
            font-family: 'Montserrat', sans-serif;
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #dc0000 0%, #ff4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 12px;
        }
        .remove-btn {
            background: transparent;
            color: #dc0000;
            border: 2px solid #dc0000;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 12px;
            align-self: flex-start;
            transition: all 0.3s ease;
        }
        .remove-btn:hover {
            background: #dc0000;
            color: #fff;
        }
        .cart-summary {
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 16px;
            color: rgba(255,255,255,0.8);
        }
        .summary-row:last-of-type {
            border-bottom: none;
        }
        .summary-row.total {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #dc0000 0%, #ff4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            border-top: 2px solid rgba(255,255,255,0.2);
            margin-top: 16px;
            padding-top: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Montserrat', sans-serif;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            font-size: 16px;
            color: #fff;
            font-family: 'Open Sans', sans-serif;
        }
        .form-group input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .form-group input:focus {
            outline: none;
            border-color: #dc0000;
            background: rgba(255,255,255,0.08);
        }
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #dc0000 0%, #ff4444 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 4px 20px rgba(220, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 0, 0, 0.6);
        }
        .btn-submit:disabled {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .success-message {
            background: linear-gradient(135deg, rgba(220,0,0,0.2) 0%, rgba(255,68,68,0.1) 100%);
            border: 2px solid #dc0000;
            color: #fff;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        .success-message h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #dc0000 0%, #ff4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .success-message p {
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }
        .error-message {
            background: rgba(220, 0, 0, 0.2);
            border: 2px solid #dc0000;
            color: #fff;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            text-align: center;
        }
        @media (max-width: 900px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
            .cart-summary {
                position: static;
            }
            .topbar {
                flex-direction: column;
                gap: 16px;
                padding: 16px 20px;
            }
            .content {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="topbar">
            <div class="brand">IBF Motors</div>
            <nav>
                <ul class="nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="catalog.html">Catalog</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="checkout.html" class="active">Cart <span class="cart-badge" id="cartCount">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="content">
        <h1>Your Cart</h1>
        <div id="checkout-content"></div>
    </main>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateCartCount() {
            const countEl = document.getElementById('cartCount');
            if (countEl) countEl.textContent = cart.length;
        }

        function renderCheckout() {
            const container = document.getElementById('checkout-content');
            updateCartCount();

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <h3>Your cart is empty</h3>
                        <p>Browse our supercars and add your dream car to the cart!</p>
                        <a href="index.html" class="btn">Browse Cars</a>
                    </div>
                `;
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);

            container.innerHTML = `
                <div class="cart-container">
                    <div class="cart-items">
                        <h2>Your Order (${cart.length} car${cart.length > 1 ? 's' : ''})</h2>
                        <div id="cart-items-list"></div>
                    </div>
                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>$${total.toLocaleString()}</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax</span>
                            <span>$0</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span>$${total.toLocaleString()}</span>
                        </div>
                        <div id="message-area"></div>
                        <form id="checkout-form">
                            <div class="form-group">
                                <label>Full Name *</label>
                                <input type="text" id="customer_name" required placeholder="Enter your full name">
                            </div>
                            <div class="form-group">
                                <label>Email *</label>
                                <input type="email" id="customer_email" required placeholder="Enter your email">
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="tel" id="customer_phone" placeholder="Enter your phone number">
                            </div>
                            <button type="submit" class="btn-submit" id="submit-btn">Place Order</button>
                        </form>
                    </div>
                </div>
            `;

            renderCartItems();
            setupForm();
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-list');
            container.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <img src="${item.image_blob || item.image_url || 'placeholder.jpg'}" alt="${escapeHtml(item.model)}">
                    <div class="cart-item-info">
                        <h3>${escapeHtml(item.model)}</h3>
                        <p>${item.year} | ${escapeHtml(item.engine || 'N/A')}</p>
                        <p class="cart-item-price">$${item.price.toLocaleString()}</p>
                        <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            renderCheckout();
        }

        function setupForm() {
            const form = document.getElementById('checkout-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const btn = document.getElementById('submit-btn');
                btn.disabled = true;
                btn.textContent = 'Processing...';

                const customerName = document.getElementById('customer_name').value;
                const customerEmail = document.getElementById('customer_email').value;
                const customerPhone = document.getElementById('customer_phone').value;

                let allSuccess = true;

                for (const item of cart) {
                    try {
                        const response = await fetch('api.php?action=order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                car_id: item.id,
                                customer_name: customerName,
                                customer_email: customerEmail,
                                customer_phone: customerPhone
                            })
                        });
                        const data = await response.json();
                        if (!data.success) allSuccess = false;
                    } catch (error) {
                        allSuccess = false;
                    }
                }

                const messageArea = document.getElementById('message-area');

                if (allSuccess) {
                    cart = [];
                    localStorage.removeItem('cart');
                    messageArea.innerHTML = `
                        <div class="success-message">
                            <h3>Order Placed Successfully!</h3>
                            <p>Thank you for your order. We will contact you soon to confirm.</p>
                            <br>
                            <a href="index.html" class="btn">Back to Home</a>
                        </div>
                    `;
                    document.getElementById('checkout-form').style.display = 'none';
                } else {
                    messageArea.innerHTML = `
                        <div class="error-message">
                            Some orders failed. Please try again.
                        </div>
                    `;
                    btn.disabled = false;
                    btn.textContent = 'Place Order';
                }
            });
        }

        renderCheckout();
    </script>
</body>
</html>
